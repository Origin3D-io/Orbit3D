name: SDK tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.11.13 clang-format==20.1.8 build
      - run: python tests/check_format.py
      - run: python -m build OrbitHub/sdk/python
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S OrbitHub -B OrbitHub/build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build OrbitHub/build --config Debug --parallel
      - run: ctest --test-dir OrbitHub/build -C Debug --output-on-failure
      - run: python -m unittest discover -s Blender/tests -v
      - run: python -m unittest discover -s FreeCAD/tests -v
      - run: python Blender/build_addon.py
      - run: python FreeCAD/build_workbench.py
      - run: python -m unittest discover -s tests -v
      - name: Build and test release runtime
        run: |
          cmake -S OrbitHub -B OrbitHub/build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build OrbitHub/build-release --config Release --parallel
          ctest --test-dir OrbitHub/build-release -C Release --output-on-failure
      - name: Package runtime
        shell: python
        run: |
          import os
          import pathlib
          import shutil
          import subprocess

          root = pathlib.Path.cwd()
          name = "orbithub.exe" if os.name == "nt" else "orbithub"
          binary = root / "OrbitHub/build-release" / ("Release" if os.name == "nt" else "") / name
          version = subprocess.check_output([str(binary), "--version"], text=True).strip()
          label = "orbithub-" + os.environ["RUNNER_OS"].lower() + "-" + os.environ["RUNNER_ARCH"].lower()
          stage = root / "OrbitHub/dist" / label
          stage.mkdir(parents=True, exist_ok=True)
          shutil.copy2(binary, stage / name)
          shutil.copy2(root / "LICENSE", stage / "LICENSE")
          (stage / "README.txt").write_text(
              version + "\n\nRun: " + name + " --simulate\n"
              "Connect an Orbit3D consumer to 127.0.0.1:43120.\n"
              "For physical input, omit --simulate and start a device provider.\n"
              "The broker does not open hardware directly.\n"
              "Stop with Ctrl+C. Do not expose the port to a network.\n\n"
              "Built for " + os.environ["RUNNER_OS"] + " " + os.environ["RUNNER_ARCH"] + ".\n"
              "Commit: " + os.environ["GITHUB_SHA"] + "\n",
              encoding="utf-8",
          )
          shutil.make_archive(str(stage), "zip", stage)
      - uses: actions/upload-artifact@v4
        with:
          name: orbithub-${{ runner.os }}-${{ runner.arch }}
          path: OrbitHub/dist/*.zip
          if-no-files-found: error
